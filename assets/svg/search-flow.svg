<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t">
  <title id="t">Semantic product search flow: a storefront query becomes a 3072-dimension embedding, runs a KNN search in OpenSearch and returns cookware results in 150–250 ms</title>
  <defs>
    <linearGradient id="search-flow-g" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#c084fc"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="search-flow-ga" gradientUnits="userSpaceOnUse" x1="240" y1="0" x2="520" y2="0">
      <stop stop-color="#c084fc"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="search-flow-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect x="0" y="0" width="640" height="400" rx="18" fill="#090710"/>

  <g font-family="Inter, system-ui, sans-serif" font-size="12">

    <!-- 1. storefront UI with the search box -->
    <rect x="16" y="36" width="220" height="322" rx="14" fill="#120e1f" stroke="rgba(148,163,184,0.18)"/>
    <circle cx="38" cy="52" r="7" fill="url(#search-flow-g)"/>
    <rect x="54" y="48" width="26" height="8" rx="4" fill="#797294" opacity="0.5"/>
    <rect x="86" y="48" width="18" height="8" rx="4" fill="#797294" opacity="0.35"/>
    <rect x="110" y="48" width="22" height="8" rx="4" fill="#797294" opacity="0.35"/>
    <circle cx="214" cy="52" r="6.5" fill="none" stroke="#797294" stroke-width="1.5"/>
    <circle cx="214" cy="50.5" r="2" fill="#797294"/>
    <path d="M210 57a4 3 0 0 1 8 0" fill="none" stroke="#797294" stroke-width="1.5"/>
    <line x1="16" y1="68.5" x2="236" y2="68.5" stroke="rgba(148,163,184,0.18)"/>

    <rect x="28" y="80" width="196" height="38" rx="8" fill="url(#search-flow-g)" opacity="0.16"/>
    <rect x="28" y="80" width="196" height="38" rx="8" fill="none" stroke="rgba(148,163,184,0.18)"/>
    <rect x="40" y="92" width="88" height="6" rx="3" fill="#ede9fe" opacity="0.5"/>
    <rect x="40" y="104" width="56" height="5" rx="2.5" fill="#ede9fe" opacity="0.25"/>

    <rect x="28" y="131" width="196" height="38" rx="9" fill="#090710" stroke="#c084fc" stroke-opacity="0.8" stroke-width="1.5"/>
    <circle cx="43" cy="149" r="5" fill="none" stroke="#a9a2c3" stroke-width="1.6"/>
    <line x1="46.8" y1="152.8" x2="51" y2="157" stroke="#a9a2c3" stroke-width="1.6" stroke-linecap="round"/>
    <text x="58" y="154.5" fill="#ede9fe">gift for someone who cooks<tspan class="blink" fill="#c084fc" dx="1">|</tspan></text>

    <g fill="#181329" stroke="rgba(148,163,184,0.18)">
      <rect x="28" y="184" width="94" height="72" rx="8"/>
      <rect x="130" y="184" width="94" height="72" rx="8"/>
      <rect x="28" y="270" width="94" height="72" rx="8"/>
      <rect x="130" y="270" width="94" height="72" rx="8"/>
    </g>
    <g fill="url(#search-flow-g)" opacity="0.18">
      <rect x="36" y="192" width="78" height="34" rx="5"/>
      <rect x="138" y="192" width="78" height="34" rx="5"/>
      <rect x="36" y="278" width="78" height="34" rx="5"/>
      <rect x="138" y="278" width="78" height="34" rx="5"/>
    </g>
    <g fill="#a9a2c3">
      <rect x="36" y="234" width="54" height="5" rx="2.5" opacity="0.5"/>
      <rect x="36" y="244" width="30" height="5" rx="2.5" opacity="0.3"/>
      <rect x="138" y="234" width="46" height="5" rx="2.5" opacity="0.5"/>
      <rect x="138" y="244" width="30" height="5" rx="2.5" opacity="0.3"/>
      <rect x="36" y="320" width="50" height="5" rx="2.5" opacity="0.5"/>
      <rect x="36" y="330" width="30" height="5" rx="2.5" opacity="0.3"/>
      <rect x="138" y="320" width="58" height="5" rx="2.5" opacity="0.5"/>
      <rect x="138" y="330" width="30" height="5" rx="2.5" opacity="0.3"/>
    </g>

    <!-- arrows, drawn in sequence -->
    <g class="draw" fill="none" stroke="url(#search-flow-ga)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path class="d1" d="M244 150H278M271 144l7 6-7 6"/>
      <path class="d2" d="M356 150H394M387 144l7 6-7 6"/>
      <path class="d3" d="M478 186V208H436V232M430 225l6 7 6-7"/>
    </g>

    <!-- 2. query as a vector -->
    <text x="316" y="106" text-anchor="middle" fill="#a9a2c3">embedding · 3072 dims</text>
    <g class="floaty">
      <circle cx="316" cy="150" r="26" fill="#c084fc" opacity="0.28" filter="url(#search-flow-glow)"/>
      <g stroke="#c084fc" stroke-opacity="0.4" stroke-width="1">
        <line x1="316" y1="150" x2="300" y2="136"/>
        <line x1="316" y1="150" x2="332" y2="140"/>
        <line x1="316" y1="150" x2="296" y2="158"/>
        <line x1="316" y1="150" x2="326" y2="166"/>
        <line x1="316" y1="150" x2="310" y2="172"/>
        <line x1="316" y1="150" x2="338" y2="156"/>
        <line x1="300" y1="136" x2="306" y2="126"/>
        <line x1="332" y1="140" x2="322" y2="128"/>
        <line x1="296" y1="158" x2="290" y2="146"/>
      </g>
      <circle cx="316" cy="150" r="4.5" fill="#c084fc"/>
      <circle cx="300" cy="136" r="3" fill="#8b5cf6"/>
      <circle cx="332" cy="140" r="3.5" fill="#c084fc"/>
      <circle cx="296" cy="158" r="2.5" fill="#c084fc"/>
      <circle cx="326" cy="166" r="3" fill="#8b5cf6"/>
      <circle cx="310" cy="172" r="2.5" fill="#c084fc"/>
      <circle cx="338" cy="156" r="2.5" fill="#8b5cf6"/>
      <circle cx="306" cy="126" r="2" fill="#8b5cf6"/>
      <circle cx="322" cy="128" r="2" fill="#c084fc"/>
      <circle cx="290" cy="146" r="2" fill="#8b5cf6"/>
      <circle cx="342" cy="134" r="1.8" fill="#c084fc"/>
    </g>

    <!-- 3. OpenSearch KNN -->
    <ellipse cx="478" cy="150" rx="64" ry="22" fill="#8b5cf6" opacity="0.3" filter="url(#search-flow-glow)"/>
    <rect x="402" y="122" width="152" height="56" rx="12" fill="#181329" stroke="url(#search-flow-g)" stroke-width="1.5"/>
    <g transform="translate(418,150)" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-linecap="round">
      <ellipse cx="0" cy="-6" rx="6" ry="2.6"/>
      <path d="M-6 -6v12a6 2.6 0 0 0 12 0v-12"/>
      <path d="M-6 0a6 2.6 0 0 0 12 0" opacity="0.6"/>
    </g>
    <text x="432" y="154.5" font-weight="500" fill="#ede9fe">OpenSearch · KNN</text>
    <rect x="420" y="92" width="134" height="22" rx="11" fill="#090710" stroke="#c084fc" stroke-opacity="0.6"/>
    <text x="487" y="106.5" text-anchor="middle" fill="#c084fc">repeat query ≈ 0 ms</text>

    <!-- 4. results -->
    <text x="248" y="230" fill="#797294">results</text>
    <g fill="#120e1f" stroke="rgba(148,163,184,0.18)">
      <rect x="248" y="240" width="120" height="60" rx="10"/>
      <rect x="376" y="240" width="120" height="60" rx="10"/>
      <rect x="504" y="240" width="120" height="60" rx="10"/>
    </g>
    <rect x="258" y="261" width="18" height="18" rx="5" fill="url(#search-flow-g)" opacity="0.65"/>
    <rect x="386" y="261" width="18" height="18" rx="5" fill="#8b5cf6" opacity="0.55"/>
    <rect x="514" y="261" width="18" height="18" rx="5" fill="#34d399" opacity="0.5"/>
    <g fill="#ede9fe">
      <text x="284" y="267">Chef's knife</text>
      <text x="412" y="267">Cast-iron pan</text>
      <text x="540" y="267">Spice set</text>
    </g>
    <g fill="#a9a2c3" opacity="0.35">
      <rect x="284" y="274" width="40" height="5" rx="2.5"/>
      <rect x="412" y="274" width="44" height="5" rx="2.5"/>
      <rect x="540" y="274" width="36" height="5" rx="2.5"/>
    </g>

    <!-- latency -->
    <text x="248" y="337" fill="#a9a2c3">latency</text>
    <text x="494" y="337" text-anchor="end" fill="#797294" text-decoration="line-through">~500 ms before</text>
    <rect x="508" y="320" width="116" height="26" rx="13" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-opacity="0.7"/>
    <path d="M519 333l4 4 7-8" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="536" y="337" font-weight="600" fill="#34d399">150–250 ms</text>
  </g>
</svg>
