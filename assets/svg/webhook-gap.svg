<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t">
  <title id="t">Missing PayPal webhook: how renewals were lost, and the fix I specified</title>
  <defs>
    <linearGradient id="webhook-gap-g" gradientUnits="userSpaceOnUse" x1="112" y1="0" x2="140" y2="0">
      <stop stop-color="#c084fc"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="webhook-gap-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="640" height="400" rx="18" fill="#090710"/>

  <!-- header -->
  <g font-family="Inter, system-ui, sans-serif">
    <text x="24" y="29" font-size="13" font-weight="600" fill="#ede9fe">Renewal events</text>
    <text x="140" y="29" font-size="12" fill="#797294">PayPal → App</text>
    <circle cx="531" cy="25" r="3.5" fill="#34d399" class="blink"/>
    <text x="616" y="29" font-size="12" fill="#a9a2c3" text-anchor="end">live platform</text>
  </g>

  <!-- BEFORE card -->
  <rect x="20" y="44" width="600" height="158" rx="14" fill="#120e1f" stroke="rgba(148,163,184,0.18)"/>
  <g font-family="Inter, system-ui, sans-serif">
    <circle cx="40" cy="66" r="3" fill="#fb7185"/>
    <text x="49" y="70" font-size="12" font-weight="600" letter-spacing="1.2" fill="#a9a2c3">BEFORE</text>

    <!-- PayPal box -->
    <rect x="36" y="104" width="76" height="44" rx="10" fill="#181329" stroke="rgba(148,163,184,0.18)"/>
    <text x="74" y="131" font-size="13" font-weight="600" fill="#ede9fe" text-anchor="middle">PayPal</text>

    <!-- the gap -->
    <line x1="150" y1="126" x2="218" y2="126" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="3 4" stroke-linecap="round" opacity="0.7"/>
    <circle cx="184" cy="126" r="10" fill="#fb7185" opacity="0.35" filter="url(#webhook-gap-glow)"/>
    <circle cx="184" cy="126" r="11" fill="#120e1f" stroke="#fb7185" stroke-width="1.5"/>
    <path d="M180 122 L188 130 M188 122 L180 130" stroke="#fb7185" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <text x="184" y="169" font-size="12" fill="#fb7185" text-anchor="middle">no webhook registered</text>

    <!-- App box -->
    <rect x="256" y="104" width="60" height="44" rx="10" fill="#181329" stroke="rgba(148,163,184,0.18)"/>
    <text x="286" y="131" font-size="13" font-weight="600" fill="#ede9fe" text-anchor="middle">App</text>

    <!-- status pill -->
    <rect x="340" y="112" width="268" height="28" rx="14" fill="#fb7185" fill-opacity="0.12" stroke="#fb7185" stroke-opacity="0.5"/>
    <text x="474" y="130" font-size="12" fill="#fb7185" text-anchor="middle">subscription expired · customer still billed</text>

    <!-- chevrons -->
    <path d="M135 122 L140 126 L135 130" stroke="#8b5cf6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M249 122 L254 126 L249 130" stroke="#797294" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6"/>
    <path d="M331 122 L336 126 L331 130" stroke="#797294" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6"/>
  </g>

  <!-- AFTER card -->
  <rect x="20" y="222" width="600" height="158" rx="14" fill="#120e1f" stroke="rgba(148,163,184,0.18)"/>
  <g font-family="Inter, system-ui, sans-serif">
    <circle cx="40" cy="244" r="3" fill="#34d399"/>
    <text x="49" y="248" font-size="12" font-weight="600" letter-spacing="1.2" fill="#a9a2c3">THE FIX (SPECIFIED)</text>

    <!-- PayPal box -->
    <rect x="36" y="282" width="76" height="44" rx="10" fill="#181329" stroke="rgba(148,163,184,0.18)"/>
    <text x="74" y="309" font-size="13" font-weight="600" fill="#ede9fe" text-anchor="middle">PayPal</text>

    <!-- webhook box -->
    <circle cx="184" cy="304" r="26" fill="#34d399" opacity="0.28" filter="url(#webhook-gap-glow)"/>
    <rect x="142" y="282" width="84" height="44" rx="10" fill="#34d399" fill-opacity="0.14" stroke="#34d399"/>
    <text x="184" y="309" font-size="13" font-weight="600" fill="#34d399" text-anchor="middle">webhook</text>
    <text x="184" y="347" font-size="12" fill="#a9a2c3" text-anchor="middle">to be registered</text>

    <!-- App box -->
    <rect x="256" y="282" width="60" height="44" rx="10" fill="#181329" stroke="rgba(148,163,184,0.18)"/>
    <text x="286" y="309" font-size="13" font-weight="600" fill="#ede9fe" text-anchor="middle">App</text>

    <!-- status pill -->
    <rect x="340" y="290" width="150" height="28" rx="14" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.5"/>
    <circle cx="358" cy="304" r="7" fill="#34d399"/>
    <path d="M354.5 304 L357 306.6 L362 301.4" stroke="#090710" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="372" y="308" font-size="12" fill="#34d399">renewal would be recorded</text>

    <!-- chevrons -->
    <path d="M135 300 L140 304 L135 308" stroke="#8b5cf6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M249 300 L254 304 L249 308" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M331 300 L336 304 L331 308" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- animated flow lines: top first, bottom second -->
  <g class="draw" fill="none" stroke-linecap="round" stroke-width="2">
    <path class="d1" d="M112 126 H138" stroke="url(#webhook-gap-g)"/>
    <path class="d2" d="M226 126 H252 M316 126 H334" stroke="#797294" opacity="0.6"/>
    <path class="d3" d="M112 304 H138" stroke="url(#webhook-gap-g)"/>
    <path class="d4" d="M226 304 H252 M316 304 H334" stroke="#34d399"/>
  </g>
</svg>
