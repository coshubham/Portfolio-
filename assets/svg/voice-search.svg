<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t">
  <title id="t">Voice search end to end: microphone input, Web Speech API transcript, results and a spoken LLM summary</title>
  <defs>
    <linearGradient id="voice-search-g" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c084fc"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="voice-search-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="640" height="400" rx="18" fill="#090710"/>

  <!-- stage labels -->
  <g font-family="Inter, system-ui, sans-serif" font-size="12" fill="#797294" letter-spacing="1.4">
    <text x="24" y="62">LISTEN</text>
    <text x="212" y="62">TRANSCRIBE</text>
    <text x="426" y="62">ANSWER</text>
  </g>

  <!-- microphone -->
  <g class="floaty">
    <circle cx="74" cy="170" r="46" fill="#c084fc" opacity="0.3" filter="url(#voice-search-glow)"/>
    <circle cx="74" cy="170" r="52" fill="none" stroke="#94a3b8" stroke-opacity="0.18"/>
    <circle cx="74" cy="170" r="40" fill="#120e1f" stroke="#c084fc" stroke-opacity="0.75" stroke-width="1.5"/>
    <rect x="66" y="148" width="16" height="28" rx="8" fill="url(#voice-search-g)"/>
    <path d="M58 168a16 16 0 0 0 32 0" fill="none" stroke="#ede9fe" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M74 184v8M66 192h16" fill="none" stroke="#ede9fe" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- animated line work: audio bars + speaker waves -->
  <g class="draw" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path class="d1" d="M122 165v10M128 161v18M134 156v28M140 150v40M146 158v24M152 147v46M158 154v32M164 160v20M170 152v36M176 162v16M182 157v26M188 165v10" stroke="#c084fc" stroke-width="3"/>
    <path class="d2" d="M454 231a8 8 0 0 1 0 16" stroke="#c084fc" stroke-width="2"/>
    <path class="d3" d="M460 225a14 14 0 0 1 0 28" stroke="#8b5cf6" stroke-width="2"/>
  </g>

  <!-- flow chevrons -->
  <g fill="none" stroke="#797294" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M198 165l6 5-6 5"/>
    <path d="M412 165l6 5-6 5"/>
  </g>

  <!-- transcript card -->
  <rect x="214" y="112" width="190" height="116" rx="12" fill="#120e1f" stroke="#94a3b8" stroke-opacity="0.18"/>
  <circle cx="232" cy="136" r="3.5" fill="#c084fc" class="blink"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="242" y="140" font-size="12" fill="#a9a2c3">Web Speech API</text>
    <text x="230" y="178" font-size="16" font-weight="500" fill="#ede9fe">wireless headphones</text>
    <text x="230" y="202" font-size="16" font-weight="500" fill="#ede9fe">under <tspan fill="#c084fc">5000</tspan></text>
  </g>

  <!-- result rows -->
  <g>
    <rect x="426" y="112" width="190" height="44" rx="10" fill="#120e1f" stroke="#94a3b8" stroke-opacity="0.18"/>
    <rect x="436" y="120" width="28" height="28" rx="7" fill="#181329" stroke="#94a3b8" stroke-opacity="0.18"/>
    <circle cx="450" cy="134" r="7" fill="url(#voice-search-g)" opacity="0.9"/>
    <rect x="474" y="124" width="92" height="6" rx="3" fill="#ede9fe" opacity="0.78"/>
    <rect x="474" y="138" width="54" height="5" rx="2.5" fill="#797294"/>
    <rect x="588" y="129" width="18" height="8" rx="4" fill="#34d399" opacity="0.9"/>

    <rect x="426" y="164" width="190" height="44" rx="10" fill="#120e1f" stroke="#94a3b8" stroke-opacity="0.18"/>
    <rect x="436" y="172" width="28" height="28" rx="7" fill="#181329" stroke="#94a3b8" stroke-opacity="0.18"/>
    <circle cx="450" cy="186" r="7" fill="url(#voice-search-g)" opacity="0.9"/>
    <rect x="474" y="176" width="80" height="6" rx="3" fill="#ede9fe" opacity="0.78"/>
    <rect x="474" y="190" width="66" height="5" rx="2.5" fill="#797294"/>
    <rect x="588" y="181" width="18" height="8" rx="4" fill="#34d399" opacity="0.9"/>
  </g>

  <!-- speaker + spoken summary -->
  <path d="M426 233h8l12-10v32l-12-10h-8z" fill="url(#voice-search-g)"/>
  <rect x="486" y="231" width="108" height="5" rx="2.5" fill="#a9a2c3" opacity="0.55"/>
  <rect x="486" y="243" width="76" height="5" rx="2.5" fill="#a9a2c3" opacity="0.55"/>
  <text x="426" y="282" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#a9a2c3">LLM summary · text-to-speech</text>

  <!-- bottom strip -->
  <line x1="24" y1="312" x2="616" y2="312" stroke="#94a3b8" stroke-opacity="0.18"/>
  <g font-family="Inter, system-ui, sans-serif" font-size="12" fill="#a9a2c3" text-anchor="middle">
    <rect x="24" y="332" width="48" height="26" rx="13" fill="#181329" stroke="#94a3b8" stroke-opacity="0.18"/>
    <text x="48" y="349">API</text>
    <rect x="82" y="332" width="146" height="26" rx="13" fill="#181329" stroke="#94a3b8" stroke-opacity="0.18"/>
    <text x="155" y="349">billing per request</text>
    <rect x="238" y="332" width="146" height="26" rx="13" fill="#181329" stroke="#94a3b8" stroke-opacity="0.18"/>
    <text x="311" y="349">analytics by source</text>
  </g>
</svg>
